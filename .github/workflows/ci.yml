name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --legacy-peer-deps: expo-router arrastra dependencias web opcionales
        # (vaul/@radix-ui) que exigen una versión de React distinta a la que
        # fija el proyecto; ver package.json para el detalle del conflicto.
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Validate content catalog
        run: npm run validate:catalog

      - name: Run tests
        run: npm test
