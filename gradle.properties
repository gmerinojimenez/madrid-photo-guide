org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9.x deja de soportar com.android.application junto a org.jetbrains.kotlin.multiplatform
# de forma nativa; estas dos flags mantienen el combo clásico mientras esa integración
# no tenga un reemplazo estable para apps (solo para librerías, ver research.md D-002).
android.builtInKotlin=false
android.newDsl=false

kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
